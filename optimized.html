<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Report a Pot Hole</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  </head>
  <body id="Main">
    <div id="Title" class="container">
      <h1 id="Title_Text" class="WhiteText">
        Report a Pot Hole
        <img src="https://www.roadtrafficsigns.com/img/lg/K/pothole-slow-down-sign-k-0757.png"
             alt="Pothole sign"
             height="50"
             width="35">
      </h1>
    </div>

    <div class="container">
      <p id="SubTitle_Text" class="WhiteText"><b>Current Potholes in the world:</b></p>
      <!-- Dynamic list loaded from Firestore -->
      <ol id="potholeList" class="WhiteText"></ol>
    </div>

    <!-- Map container -->
    <div id="map"></div>

    <!-- Report Form -->
    <div class="container" style="position: relative;">
      <h1 id="Title_Text" class="WhiteText">Report:</h1>
      <form id="reportForm">
        <div>
          <label class="WhiteText" for="name">Name:</label>
        </div>
        <div>
          <input class="Margin" id="nameInput" type="text" name="name" placeholder="Your name..." required>
        </div>
        <div>
          <label class="WhiteText" for="address">Address:</label>
        </div>
        <div style="position: relative;">
          <input class="Margin" id="addressInput" type="text" name="address" placeholder="Your address..." required autocomplete="off">
          <!-- Container for autocomplete suggestions -->
          <div id="autocomplete-suggestions"></div>
        </div>
        <div>
          <input class="Margin" id="SubmitBox" type="submit" value="Submit">
        </div>
      </form>
    </div>

    <!-- Firebase and Application Logic using ES Modules -->
    <script type="module">
      // Import Firebase modules from version 11.3.1
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-analytics.js";
      import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore.js";

      // Firebase configuration (replace with your actual config values)
      // Note: For production, use environment variables or a secure config file
      const firebaseConfig = {
        apiKey: "AIzaSyDJxdKWAIkY3BFiHa9eIxzvzGrRwDQAo-U",
        authDomain: "minievent2025.firebaseapp.com",
        projectId: "minievent2025",
        storageBucket: "minievent2025.firebasestorage.app",
        messagingSenderId: "733627669272",
        appId: "1:733627669272:web:90c09a9595b6f936561c6d",
        measurementId: "G-HP9ZS5LRQV"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const db = getFirestore(app);

      // Initialize the map with Leaflet
      // Set initial view to a hardcoded location (could be dynamic for production)
      const map = L.map('map').setView([41.6929765, -83.8129724], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      // Variable to keep track of the current marker on the map
      // Ensures only one marker is shown at a time
      let currentMarker = null;

      // Function to show a pothole location on the map
      // Removes existing marker (if any) and adds a new one
      function showOnMap(lat, lng) {
        // Remove existing marker if it exists
        if (currentMarker) {
          map.removeLayer(currentMarker);
        }
        // Add new marker and center the map on it
        currentMarker = L.marker([lat, lng]).addTo(map)
          .bindPopup('Pothole Location')
          .openPopup();
        map.setView([lat, lng], 15);
      }

      // Function to load pothole reports from Firestore and display in the list
      async function loadPotholes() {
        // Reference to the potholes collection, ordered by timestamp descending
        const potholesRef = collection(db, "potholes");
        const q = query(potholesRef, orderBy("timestamp", "desc"));
        try {
          const querySnapshot = await getDocs(q);
          const listElement = document.getElementById("potholeList");
          listElement.innerHTML = ""; // Clear current list
          querySnapshot.forEach((doc) => {
            const data = doc.data();
            // Create list item with address and "View on Map" button
            const li = document.createElement("li");
            li.textContent = data.address;
            const button = document.createElement("button");
            button.textContent = "View on Map";
            button.style.marginLeft = "10px";
            button.onclick = () => { showOnMap(data.lat, data.lng); };
            li.appendChild(button);
            listElement.appendChild(li);
          });
        } catch (error) {
          console.error("Error loading potholes:", error);
          // Note: Could alert user for better feedback (e.g., "Failed to load reports. Please try again.")
        }
      }

      // Load existing pothole reports when the page loads
      loadPotholes();

      // Variables to store selected coordinates for reporting
      let selectedLat = null;
      let selectedLng = null;

      // Handle form submission to add a new pothole report
      document.getElementById("reportForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const name = document.getElementById("nameInput").value;
        const address = document.getElementById("addressInput").value;

        // Ensure a location has been selected
        if (selectedLat === null || selectedLng === null) {
          alert("Please select a valid address from the suggestions or click on the map.");
          return;
        }

        try {
          // Add report to Firestore with coordinates as numbers
          await addDoc(collection(db, "potholes"), {
            name: name,
            address: address,
            lat: selectedLat,
            lng: selectedLng,
            timestamp: serverTimestamp()
          });
          alert("Report submitted successfully!");
          // Reset the form and clear selected coordinates
          document.getElementById("reportForm").reset();
          selectedLat = null;
          selectedLng = null;
          // Reload the list to include the new report
          loadPotholes();
        } catch (error) {
          console.error("Error adding report:", error);
          // Note: Could alert user for better feedback (e.g., "Failed to submit report. Please try again.")
        }
      });

      // ----- Autocomplete for Address Input using Nominatim -----
      const addressInput = document.getElementById("addressInput");
      const suggestionsContainer = document.getElementById("autocomplete-suggestions");
      let debounceTimeout;

      addressInput.addEventListener("input", () => {
        // Clear any existing debounce timeout
        clearTimeout(debounceTimeout);
        const query = addressInput.value.trim();
        // Clear suggestions if query is empty
        if (!query) {
          suggestionsContainer.innerHTML = "";
          return;
        }
        // Debounce request by 300ms to avoid excessive API calls
        debounceTimeout = setTimeout(async () => {
          try {
            // Comply with Nominatim usage policy by setting a custom User-Agent
            // See: https://operations.osmfoundation.org/policies/nominatim/
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}`, {
              headers: {
                'User-Agent': 'PotholeReporterApp/1.0'
              }
            });
            const results = await response.json();
            suggestionsContainer.innerHTML = "";
            // Show up to 5 suggestions
            results.slice(0, 5).forEach(result => {
              const item = document.createElement("div");
              item.classList.add("suggestion-item");
              item.textContent = result.display_name;
              item.addEventListener("click", () => {
                addressInput.value = result.display_name;
                // Store coordinates as numbers
                selectedLat = parseFloat(result.lat);
                selectedLng = parseFloat(result.lon);
                suggestionsContainer.innerHTML = "";
                showOnMap(selectedLat, selectedLng);
              });
              suggestionsContainer.appendChild(item);
            });
          } catch (error) {
            console.error("Autocomplete error:", error);
            // Note: Could alert user for better feedback (e.g., "Failed to fetch suggestions. Please try again.")
          }
        }, 300);
      });

      // ----- Reverse Geocoding on Map Click -----
      map.on('click', async (e) => {
        const { lat, lng } = e.latlng;
        try {
          // Comply with Nominatim usage policy by setting a custom User-Agent
          // See: https://operations.osmfoundation.org/policies/nominatim/
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`, {
            headers: {
              'User-Agent': 'PotholeReporterApp/1.0'
            }
          });
          const data = await response.json();
          if (data && data.display_name) {
            addressInput.value = data.display_name;
            // Store coordinates as numbers
            selectedLat = lat;
            selectedLng = lng;
            showOnMap(lat, lng);
          }
        } catch (error) {
          console.error("Reverse geocoding error:", error);
          // Note: Could alert user for better feedback (e.g., "Failed to determine location. Please try again.")
        }
      });
    </script>
  </body>
</html>
