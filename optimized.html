<!DOCTYPE html>
<html>
  <head>
    <title>Report A Pot Hole</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  </head>
  <body class="Main" id="Main">
    <div id="Title">
      <h1 id="Title_Text" class="WhiteText">
        Report A Pot Hole
        <img src="https://www.roadtrafficsigns.com/img/lg/K/pothole-slow-down-sign-k-0757.png"
             alt="Pothole sign" height="50" width="35">
      </h1>
    </div>
    <div>
      <p id="SubTitle_Text" class="WhiteText"><b>Current Potholes in the world:</b></p>
      <ol id="potholeList" class="WhiteText"></ol>
    </div>
    <!-- Map container -->
    <div id="map"></div>
    <!-- Report Form (Note: No action attribute is used) -->
    <div class="container">
      <h1 id="Title_Text" class="WhiteText">Report:</h1>
      <form id="reportForm">
        <div>
          <label class="WhiteText" for="name">Name:</label>
        </div>
        <div>
          <input class="Margin" id="nameInput" type="text" name="name" placeholder="Your name..." required>
        </div>
        <div>
          <label class="WhiteText" for="address">Address:</label>
        </div>
        <div>
          <input class="Margin" id="addressInput" type="text" name="address" placeholder="Your address..." required>
        </div>
        <div>
          <label class="WhiteText" for="lat">Latitude:</label>
        </div>
        <div>
          <input class="Margin" id="latInput" type="number" step="any" name="lat" placeholder="Latitude" required>
        </div>
        <div>
          <label class="WhiteText" for="lng">Longitude:</label>
        </div>
        <div>
          <input class="Margin" id="lngInput" type="number" step="any" name="lng" placeholder="Longitude" required>
        </div>
        <input class="Margin" id="SubmitBox" type="submit" value="Submit">
      </form>
    </div>
    
    <!-- Firebase and Application Logic using ES Modules -->
    <script type="module">
      // Import Firebase modules from version 11.3.1
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-analytics.js";
      import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore.js";
      
      // Your Firebase configuration (replace with your actual config values from the Firebase Console)
      const firebaseConfig = {
        apiKey: "AIzaSyDJxdKWAIkY3BFiHa9eIxzvzGrRwDQAo-U",
        authDomain: "minievent2025.firebaseapp.com",
        projectId: "minievent2025",
        storageBucket: "minievent2025.firebasestorage.app",
        messagingSenderId: "733627669272",
        appId: "1:733627669272:web:90c09a9595b6f936561c6d",
        measurementId: "G-HP9ZS5LRQV"
      };
      
      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const db = getFirestore(app);
      
      // Initialize the map with Leaflet
      const map = L.map('map').setView([41.6929765, -83.8129724], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      
      // Function to show a pothole on the map
      function showOnMap(lat, lng) {
        map.setView([lat, lng], 15);
        L.marker([lat, lng]).addTo(map)
          .bindPopup('Pothole Location')
          .openPopup();
      }
      
      // Function to load pothole reports from Firestore and update the UI
      async function loadPotholes() {
        const potholesRef = collection(db, "potholes");
        const q = query(potholesRef, orderBy("timestamp", "desc"));
        try {
          const querySnapshot = await getDocs(q);
          const listElement = document.getElementById("potholeList");
          listElement.innerHTML = ""; // Clear existing list
          querySnapshot.forEach((doc) => {
            const data = doc.data();
            // Create a list item for each report
            const li = document.createElement("li");
            li.textContent = data.address;
            // Create a button to view the location on the map
            const button = document.createElement("button");
            button.textContent = "View on Map";
            button.onclick = () => { showOnMap(data.lat, data.lng); };
            li.appendChild(button);
            listElement.appendChild(li);
            // Add a marker to the map for the report
            L.marker([data.lat, data.lng]).addTo(map)
              .bindPopup(`<b>${data.name}</b><br>${data.address}`);
          });
        } catch (error) {
          console.error("Error loading potholes: ", error);
        }
      }
      
      // Initial load of reports
      loadPotholes();
      
      // Handle form submission to add a new pothole report
      document.getElementById("reportForm").addEventListener("submit", async (event) => {
        event.preventDefault(); // Prevent default form submission behavior
        const name = document.getElementById("nameInput").value;
        const address = document.getElementById("addressInput").value;
        const lat = parseFloat(document.getElementById("latInput").value);
        const lng = parseFloat(document.getElementById("lngInput").value);
        try {
          await addDoc(collection(db, "potholes"), {
            name: name,
            address: address,
            lat: lat,
            lng: lng,
            timestamp: serverTimestamp()
          });
          alert("Report submitted successfully!");
          document.getElementById("reportForm").reset();
          loadPotholes(); // Reload reports to include the new one
        } catch (error) {
          console.error("Error adding report: ", error);
        }
      });
    </script>
  </body>
</html>
