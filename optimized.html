<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Report a Pot Hole</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  </head>
  <body id="Main">
    <div id="Title" class="container">
      <h1 id="Title_Text" class="WhiteText">
        Report a Pot Hole
        <img src="https://www.roadtrafficsigns.com/img/lg/K/pothole-slow-down-sign-k-0757.png"
             alt="Pothole sign"
             height="50"
             width="35">
      </h1>
    </div>

    <div class="container">
      <p id="SubTitle_Text" class="WhiteText"><b>Current Potholes in the world:</b></p>
      <!-- Dynamic list loaded from Firestore -->
      <ol id="potholeList" class="WhiteText"></ol>
    </div>

    <!-- Map container -->
    <div id="map"></div>

    <!-- Report Form -->
    <div class="container" style="position: relative;">
      <h1 id="Title_Text" class="WhiteText">Report:</h1>
      <form id="reportForm">
        <div>
          <label class="WhiteText" for="name">Name:</label>
        </div>
        <div>
          <input class="Margin" id="nameInput" type="text" name="name" placeholder="Your name..." required>
        </div>
        <div>
          <label class="WhiteText" for="address">Address:</label>
        </div>
        <div style="position: relative;">
          <input class="Margin" id="addressInput" type="text" name="address" placeholder="Your address..." required autocomplete="off">
          <!-- Container for autocomplete suggestions -->
          <div id="autocomplete-suggestions"></div>
        </div>
        <div>
          <input class="Margin" id="SubmitBox" type="submit" value="Submit">
        </div>
      </form>
    </div>

    <!-- Firebase and Application Logic using ES Modules -->
    <script type="module">
      // Import Firebase modules from version 11.3.1
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-analytics.js";
      import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore.js";
      
      // Your Firebase configuration (replace with your actual config values)
      const firebaseConfig = {
        apiKey: "AIzaSyDJxdKWAIkY3BFiHa9eIxzvzGrRwDQAo-U",
        authDomain: "minievent2025.firebaseapp.com",
        projectId: "minievent2025",
        storageBucket: "minievent2025.firebasestorage.app",
        messagingSenderId: "733627669272",
        appId: "1:733627669272:web:90c09a9595b6f936561c6d",
        measurementId: "G-HP9ZS5LRQV"
      };
      
      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const db = getFirestore(app);
      
      // Initialize the map with Leaflet
      const map = L.map('map').setView([41.6929765, -83.8129724], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      
      // Function to show a pothole's location on the map, using your original marker icon and popup
      function showOnMap(lat, lng) {
        map.setView([lat, lng], 15);
        L.marker([lat, lng]).addTo(map)
          .bindPopup('Pothole Location')
          .openPopup();
      }
      
      // Function to load pothole reports from Firestore and display them
      async function loadPotholes() {
        const potholesRef = collection(db, "potholes");
        const q = query(potholesRef, orderBy("timestamp", "desc"));
        try {
          const querySnapshot = await getDocs(q);
          const listElement = document.getElementById("potholeList");
          listElement.innerHTML = ""; // Clear current list
          querySnapshot.forEach((doc) => {
            const data = doc.data();
            // Create a list item similar to the original format
            const li = document.createElement("li");
            li.textContent = data.address;
            const button = document.createElement("button");
            button.textContent = "View on Map";
            button.style.marginLeft = "10px";
            button.onclick = () => { showOnMap(data.lat, data.lng); };
            li.appendChild(button);
            listElement.appendChild(li);
          });
        } catch (error) {
          console.error("Error loading potholes:", error);
        }
      }
      
      // Initial load of reports
      loadPotholes();
      
      // Variables to store selected coordinates (instead of hidden inputs)
      let selectedLat = null;
      let selectedLng = null;
      
      // Handle form submission to add a new report via Firebase
      document.getElementById("reportForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const name = document.getElementById("nameInput").value;
        const address = document.getElementById("addressInput").value;
        
        if (selectedLat === null || selectedLng === null) {
          alert("Please select a valid address from the suggestions or click on the map.");
          return;
        }
        
        try {
          await addDoc(collection(db, "potholes"), {
            name: name,
            address: address,
            lat: selectedLat,
            lng: selectedLng,
            timestamp: serverTimestamp()
          });
          alert("Report submitted successfully!");
          document.getElementById("reportForm").reset();
          // Reset the stored coordinates
          selectedLat = null;
          selectedLng = null;
          loadPotholes();
        } catch (error) {
          console.error("Error adding report:", error);
        }
      });
      
      // ----- Simple Autocomplete using Nominatim -----
      const addressInput = document.getElementById("addressInput");
      const suggestionsContainer = document.getElementById("autocomplete-suggestions");
      let debounceTimeout;
      
      addressInput.addEventListener("input", () => {
        clearTimeout(debounceTimeout);
        const query = addressInput.value.trim();
        if (!query) {
          suggestionsContainer.innerHTML = "";
          return;
        }
        debounceTimeout = setTimeout(async () => {
          try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}`);
            const results = await response.json();
            suggestionsContainer.innerHTML = "";
            results.slice(0, 5).forEach(result => {
              const item = document.createElement("div");
              item.classList.add("suggestion-item");
              item.textContent = result.display_name;
              item.addEventListener("click", () => {
                // Set the address input, capture lat/lng, center the map, and drop a marker
                addressInput.value = result.display_name;
                selectedLat = parseFloat(result.lat).toFixed(6);
                selectedLng = parseFloat(result.lon).toFixed(6);
                suggestionsContainer.innerHTML = "";
                showOnMap(selectedLat, selectedLng);
              });
              suggestionsContainer.appendChild(item);
            });
          } catch (error) {
            console.error("Autocomplete error:", error);
          }
        }, 300); // Debounce by 300ms
      });
      
      // ----- Map Click Reverse Geocoding -----
      map.on('click', async (e) => {
        const { lat, lng } = e.latlng;
        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
          const data = await response.json();
          if (data && data.display_name) {
            addressInput.value = data.display_name;
            selectedLat = parseFloat(lat).toFixed(6);
            selectedLng = parseFloat(lng).toFixed(6);
            // Center the map and drop a marker just like in your original code
            showOnMap(selectedLat, selectedLng);
          }
        } catch (error) {
          console.error("Reverse geocoding error:", error);
        }
      });
    </script>
  </body>
</html>
